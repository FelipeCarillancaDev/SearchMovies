<div class="movie" (click)="selectMovie()">
  <div>
    <p>{{ movie.release_date | date:'yyyy' }}</p>
  </div>
  <div>
    <img [src]="getImage()" [alt]="movie.original_title">
  </div>
  <div>
    <span>Ranking: {{ movie.vote_average | number:'1.1-1' }}</span> <!--Dejar solo un decimal-->
    <h3>{{ movie.title }}</h3>
  </div>
</div>
